spring:
  application:
    name: aihire-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aihire}
    username: ${DB_USERNAME:aihire}
    password: ${DB_PASSWORD:aihire_password}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  ai:
    model:
      chat: google-genai
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-3.5-flash-lite

jwt:
  secret: ${JWT_SECRET:change-this-development-secret-key}
  access-token-expiration: 900000
  refresh-token-expiration: 604800000