spring:
  application:
    name: aihire-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aihire}
    username: ${DB_USERNAME:aihire}
    password: ${DB_PASSWORD:aihire_password}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true